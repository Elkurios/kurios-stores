<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurios Stores — Seller Admin</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>
<style>

    :root {
        --purple: #6d28d9;
        --purple-dark: #4c1d95;
        --purple-soft: #f3e8ff;
        --text: #27272a;
        --muted: #6b7280;
        --border: #e4e4e7;
        --white: #ffffff;
        --bg: #f9fafb;
        --red: #dc2626;
        --amber: #b45309;
        --green: #15803d;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    header {
        background: var(--white);
        border-bottom: 1px solid var(--border);
        padding: 18px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    header h1 {
        font-size: 18px;
        margin: 0;
    }

    header h1 span {
        color: var(--purple);
    }

    #logoutButton {
        border: 1px solid var(--border);
        background: var(--white);
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
    }

    main {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px;
    }

    /* KEY GATE */

    #keyGate {
        max-width: 400px;
        margin: 80px auto;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 28px;
        text-align: center;
    }

    #keyGate h2 {
        margin: 0 0 8px;
        font-size: 18px;
    }

    #keyGate p {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 18px;
    }

    #keyGate input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 4px;
    }

    #keyGate label {
        display: block;
        text-align: left;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 6px;
        margin-top: 14px;
    }

    #keyGate label:first-of-type {
        margin-top: 0;
    }

    .password-field-wrap {
        position: relative;
    }

    .password-field-wrap input {
        padding-right: 38px !important;
        margin-bottom: 0 !important;
    }

    #keyGate .password-toggle-btn {
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        width: 28px;
        height: 28px;
        min-width: 28px;
        padding: 0;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #6b7280;
        font-size: 14px;
        font-weight: 400;
        cursor: pointer;
        opacity: 0.6;
    }

    #keyGate .password-toggle-btn:hover {
        opacity: 1;
    }

    #keyGate button {
        width: 100%;
        border: none;
        background: var(--purple);
        color: white;
        border-radius: 8px;
        padding: 11px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }

    #keyGateError {
        color: var(--red);
        font-size: 13px;
        margin-top: 10px;
        min-height: 16px;
    }

    /* FILTER TABS */

    .filter-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
        flex-wrap: wrap;
    }

    .filter-tab {
        border: 1px solid var(--border);
        background: var(--white);
        border-radius: 999px;
        padding: 7px 14px;
        font-size: 13px;
        cursor: pointer;
        color: var(--muted);
    }

    .filter-tab.active {
        background: var(--purple);
        border-color: var(--purple);
        color: white;
        font-weight: 600;
    }

    /* SELLER CARD */

    .kurios-store-card {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 20px;
    }

    .kurios-store-logo {
        width: 52px;
        height: 52px;
        min-width: 52px;
        border-radius: 12px;
        background: var(--purple-soft, #f3e8ff);
        color: var(--purple);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        overflow: hidden;
    }

    .kurios-store-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .kurios-store-info h3 {
        margin: 0 0 3px;
        font-size: 14px;
    }

    .kurios-store-info p {
        margin: 0 0 8px;
        font-size: 12px;
        color: var(--muted);
    }

    .kurios-store-logo-button {
        display: inline-block;
        border: 1px solid var(--border);
        background: var(--bg);
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
    }

    .seller-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 14px;
    }

    .seller-card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 10px;
    }

    .seller-card-top h3 {
        margin: 0 0 4px;
        font-size: 16px;
    }

    .seller-card-top p {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
    }

    .status-pill {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        padding: 4px 10px;
        border-radius: 999px;
        white-space: nowrap;
    }

    .status-pending {
        background: #fef3c7;
        color: var(--amber);
    }

    .status-approved {
        background: #dcfce7;
        color: var(--green);
    }

    .status-rejected,
    .status-suspended {
        background: #fee2e2;
        color: var(--red);
    }

    .seller-detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 20px;
        font-size: 13px;
        margin-bottom: 12px;
    }

    .seller-detail-grid div strong {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        margin-bottom: 2px;
    }

    .seller-description {
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 12px;
    }

    .seller-card-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .seller-card-actions button {
        border: none;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }

    .btn-approve {
        background: var(--green);
        color: white;
    }

    .btn-reject {
        background: var(--red);
        color: white;
    }

    .btn-suspend {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border) !important;
    }

    #emptyState,
    #loadingState {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        padding: 40px 0;
    }

    /* PAGE TABS */

    .page-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border);
    }

    .page-tab {
        border: none;
        background: transparent;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 700;
        color: var(--muted);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
    }

    .page-tab.active {
        color: var(--purple);
        border-bottom-color: var(--purple);
    }

    /* STUDENTS PAGE */

    .admin-search {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 18px;
    }

    .student-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .student-card-info h4 {
        margin: 0 0 4px;
        font-size: 15px;
    }

    .student-card-info p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
    }

    .student-card-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
    }

    /* ANNOUNCEMENTS PAGE */

    .announce-form {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 24px;
    }

    .announce-form label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 6px;
        margin-top: 14px;
    }

    .announce-form label:first-of-type {
        margin-top: 0;
    }

    .announce-form input,
    .announce-form textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        font-family: inherit;
        resize: vertical;
    }

    .announce-form button {
        margin-top: 16px;
        border: none;
        background: var(--purple);
        color: white;
        border-radius: 8px;
        padding: 11px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }

    .announce-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 10px;
    }

    .announce-card h4 {
        margin: 0 0 4px;
        font-size: 14px;
    }

    .announce-card p {
        margin: 0 0 6px;
        font-size: 13px;
        color: var(--text);
    }

    .announce-card time {
        font-size: 11px;
        color: var(--muted);
    }

</style>
</head>
<body>

<!-- ADMIN LOGIN -->

<div id="keyGate">
    <h2>Kurios Admin</h2>
    <p>Sign in to review seller applications.</p>

    <label for="adminUsernameInput">Username</label>
    <input type="text" id="adminUsernameInput" placeholder="Username">

    <label for="adminPasswordInput">Password</label>
    <div class="password-field-wrap">
        <input type="password" id="adminPasswordInput" placeholder="Password">
        <button type="button" class="password-toggle-btn" id="adminPasswordToggle" aria-label="Show password">
            <i class="fa-regular fa-eye"></i>
        </button>
    </div>

    <button id="adminLoginSubmit" style="margin-top: 16px;">Sign In</button>
    <div id="keyGateError"></div>
</div>


<!-- MAIN ADMIN VIEW -->

<div id="adminView" style="display: none;">

    <header>
        <h1>Kurios <span>Admin</span></h1>
        <button id="logoutButton">Log out</button>
    </header>

    <main>

        <div class="page-tabs">
            <button class="page-tab active" data-page="sellers">Sellers</button>
            <button class="page-tab" data-page="students">Students</button>
            <button class="page-tab" data-page="announcements">Announcements</button>
        </div>


        <!-- SELLERS PAGE -->

        <div id="sellersPage" class="admin-page">

            <div class="kurios-store-card" id="kuriosStoreCard">

                <div class="kurios-store-logo" id="kuriosStoreLogo">
                    <i class="fa-solid fa-store"></i>
                </div>

                <div class="kurios-store-info">
                    <h3>Kurios Stores (official)</h3>
                    <p id="kuriosStoreLinkStatus">
                        Not yet linked to a student account.
                    </p>
                    <label for="kuriosStoreLogoInput" class="kurios-store-logo-button">
                        Change Logo
                    </label>
                    <input type="file" id="kuriosStoreLogoInput" accept="image/png, image/jpeg, image/webp" style="display: none;">
                    <span id="kuriosStoreLogoStatus" style="font-size: 12px; margin-left: 8px;"></span>

                    <div style="margin-top: 10px;">
                        <input
                            type="email"
                            id="kuriosStoreLinkEmail"
                            placeholder="student@example.com"
                            style="border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12px; width: 200px;"
                        >
                        <button
                            id="kuriosStoreLinkButton"
                            class="kurios-store-logo-button"
                            style="border: none; background: var(--purple); color: white; cursor: pointer;"
                        >
                            Link to Student Account
                        </button>
                        <span id="kuriosStoreLinkFormStatus" style="font-size: 12px; margin-left: 8px;"></span>
                    </div>
                </div>

            </div>

            <div class="filter-tabs">
                <button class="filter-tab active" data-status="">All</button>
                <button class="filter-tab" data-status="pending">Pending</button>
                <button class="filter-tab" data-status="approved">Approved</button>
                <button class="filter-tab" data-status="rejected">Rejected</button>
                <button class="filter-tab" data-status="suspended">Suspended</button>
            </div>

            <div id="loadingState">Loading sellers...</div>
            <div id="emptyState" style="display: none;">No sellers found for this filter.</div>
            <div id="sellerList"></div>

        </div>


        <!-- STUDENTS PAGE -->

        <div id="studentsPage" class="admin-page" style="display: none;">

            <input
                type="text"
                id="studentSearchInput"
                class="admin-search"
                placeholder="Search by name, email, university, student ID, or phone..."
            >

            <div id="studentsLoadingState">Loading students...</div>
            <div id="studentsEmptyState" style="display: none;">No students found.</div>
            <div id="studentList"></div>

        </div>


        <!-- ANNOUNCEMENTS PAGE -->

        <div id="announcementsPage" class="admin-page" style="display: none;">

            <div class="announce-form">

                <label for="announceTitle">Title</label>
                <input type="text" id="announceTitle" placeholder="e.g. New products just dropped!">

                <label for="announceMessage">Message</label>
                <textarea id="announceMessage" rows="4" placeholder="What do you want to tell every student?"></textarea>

                <div id="announceStatus" style="font-size: 13px; margin-top: 10px;"></div>

                <button id="sendAnnouncementButton">Send to All Students</button>

            </div>

            <h3 style="font-size: 15px; margin-bottom: 12px;">Sent Announcements</h3>

            <div id="announcementsLoadingState">Loading...</div>
            <div id="announcementsEmptyState" style="display: none; color: var(--muted); font-size: 13px;">No announcements sent yet.</div>
            <div id="announcementList"></div>

        </div>

    </main>

</div>


<script>

    const API_URL = "https://kurios-stores-backend.onrender.com";

    const keyGate = document.getElementById("keyGate");
    const adminView = document.getElementById("adminView");
    const adminUsernameInput = document.getElementById("adminUsernameInput");
    const adminPasswordInput = document.getElementById("adminPasswordInput");
    const adminLoginSubmit = document.getElementById("adminLoginSubmit");
    const keyGateError = document.getElementById("keyGateError");
    const logoutButton = document.getElementById("logoutButton");
    const filterTabs = document.querySelectorAll(".filter-tab");
    const loadingState = document.getElementById("loadingState");
    const emptyState = document.getElementById("emptyState");
    const sellerList = document.getElementById("sellerList");

    let currentFilter = "";

    function getAdminToken() {
        return sessionStorage.getItem("kuriosAdminToken") || "";
    }

    function showAdminView() {
        keyGate.style.display = "none";
        adminView.style.display = "block";
        loadSellers();
        loadKuriosStore();
    }

    function showKeyGate(message) {
        adminView.style.display = "none";
        keyGate.style.display = "block";
        keyGateError.textContent = message || "";
    }

    if (getAdminToken()) {
        showAdminView();
    }

    adminLoginSubmit.addEventListener("click", async function () {

        const username = adminUsernameInput.value.trim();
        const password = adminPasswordInput.value;

        if (!username || !password) {
            keyGateError.textContent = "Please enter your username and password.";
            return;
        }

        adminLoginSubmit.disabled = true;
        adminLoginSubmit.textContent = "Signing in...";
        keyGateError.textContent = "";

        try {

            const response = await fetch(API_URL + "/api/admin/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username: username, password: password })
            });

            const data = await response.json();

            if (!data.success) {
                keyGateError.textContent = data.message || "Invalid username or password.";
                return;
            }

            sessionStorage.setItem("kuriosAdminToken", data.token);
            showAdminView();

        } catch (error) {

            keyGateError.textContent = "Could not connect to Kurios Stores server.";

        } finally {

            adminLoginSubmit.disabled = false;
            adminLoginSubmit.textContent = "Sign In";

        }

    });

    [adminUsernameInput, adminPasswordInput].forEach(function (input) {

        input.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                adminLoginSubmit.click();
            }
        });

    });

    logoutButton.addEventListener("click", function () {
        sessionStorage.removeItem("kuriosAdminToken");
        showKeyGate("");
    });

    filterTabs.forEach(function (tab) {

        tab.addEventListener("click", function () {

            filterTabs.forEach(function (t) {
                t.classList.remove("active");
            });

            tab.classList.add("active");
            currentFilter = tab.dataset.status;
            loadSellers();

        });

    });

    function statusLabel(status) {
        return status.charAt(0).toUpperCase() + status.slice(1);
    }

    function renderSellers(sellers) {

        sellerList.innerHTML = "";

        if (sellers.length === 0) {
            emptyState.style.display = "block";
            return;
        }

        emptyState.style.display = "none";

        sellers.forEach(function (seller) {

            const card = document.createElement("div");
            card.className = "seller-card";

            const studentName =
                (seller.first_name || "") + " " + (seller.last_name || "");

            card.innerHTML = `
                <div class="seller-card-top">
                    <div>
                        <h3>${escapeHtml(seller.store_name)}</h3>
                        <p>${escapeHtml(studentName.trim())} — ${escapeHtml(seller.student_email || "")}</p>
                    </div>
                    <span class="status-pill status-${seller.status}">${statusLabel(seller.status)}</span>
                </div>

                <div class="seller-detail-grid">
                    <div><strong>Seller Type</strong>${escapeHtml(seller.seller_type || "—")}</div>
                    <div><strong>Category</strong>${escapeHtml(seller.business_category || "—")}</div>
                    <div><strong>University</strong>${escapeHtml(seller.university || "—")}</div>
                    <div><strong>Location</strong>${escapeHtml(seller.location || "—")}</div>
                    <div><strong>Phone</strong>${escapeHtml(seller.contact_phone || "—")}</div>
                    <div><strong>WhatsApp</strong>${escapeHtml(seller.contact_whatsapp || "—")}</div>
                </div>

                ${seller.store_description ? `<div class="seller-description">${escapeHtml(seller.store_description)}</div>` : ""}

                ${seller.status === "rejected" && seller.rejection_reason ? `<div class="seller-description">Rejection reason: ${escapeHtml(seller.rejection_reason)}</div>` : ""}

                <div class="seller-card-actions"></div>
            `;

            const actions = card.querySelector(".seller-card-actions");

            if (seller.status === "pending") {

                const approveBtn = document.createElement("button");
                approveBtn.className = "btn-approve";
                approveBtn.textContent = "Approve";
                approveBtn.addEventListener("click", function () {
                    updateStatus(seller.id, "approve");
                });

                const rejectBtn = document.createElement("button");
                rejectBtn.className = "btn-reject";
                rejectBtn.textContent = "Reject";
                rejectBtn.addEventListener("click", function () {
                    const reason = prompt("Reason for rejecting this application (optional):") || "";
                    updateStatus(seller.id, "reject", reason);
                });

                actions.appendChild(approveBtn);
                actions.appendChild(rejectBtn);

            } else if (seller.status === "approved") {

                const suspendBtn = document.createElement("button");
                suspendBtn.className = "btn-suspend";
                suspendBtn.textContent = "Suspend";
                suspendBtn.addEventListener("click", function () {
                    if (confirm("Suspend " + seller.store_name + "?")) {
                        updateStatus(seller.id, "suspend");
                    }
                });

                actions.appendChild(suspendBtn);

            } else if (seller.status === "suspended") {

                const approveBtn = document.createElement("button");
                approveBtn.className = "btn-approve";
                approveBtn.textContent = "Reinstate";
                approveBtn.addEventListener("click", function () {
                    updateStatus(seller.id, "approve");
                });

                actions.appendChild(approveBtn);

            }

            sellerList.appendChild(card);

        });

    }

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text == null ? "" : String(text);
        return div.innerHTML;
    }

    async function loadSellers(silent) {

        loadingState.style.display = silent ? "none" : "block";
        sellerList.innerHTML = "";
        emptyState.style.display = "none";

        try {

            const url =
                API_URL + "/api/admin/sellers" +
                (currentFilter ? "?status=" + currentFilter : "");

            const response = await fetch(url, {
                headers: {
                    "Authorization": "Bearer " + getAdminToken()
                }
            });

            if (response.status === 401) {

                sessionStorage.removeItem("kuriosAdminToken");

                if (!silent) {
                    showKeyGate("Your session expired. Please sign in again.");
                } else {
                    keyGateError.textContent = "Your session expired. Please sign in again.";
                }

                return false;

            }

            const data = await response.json();

            loadingState.style.display = "none";

            if (!data.success) {

                if (silent) {
                    keyGateError.textContent = data.message || "Could not connect.";
                } else {
                    emptyState.textContent = data.message || "Could not load sellers.";
                    emptyState.style.display = "block";
                }

                return false;

            }

            renderSellers(data.sellers);
            return true;

        } catch (error) {

            loadingState.style.display = "none";

            const message = "Could not connect to Kurios Stores server.";

            if (silent) {
                keyGateError.textContent = message;
            } else {
                emptyState.textContent = message;
                emptyState.style.display = "block";
            }

            return false;

        }

    }

    async function updateStatus(sellerId, action, reason) {

        try {

            const response = await fetch(
                API_URL + "/api/admin/sellers/" + sellerId + "/" + action,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + getAdminToken()
                    },
                    body: JSON.stringify({ reason: reason || "" })
                }
            );

            const data = await response.json();

            if (!data.success) {
                alert(data.message || "Could not update seller status.");
                return;
            }

            loadSellers();

        } catch (error) {

            alert("Could not connect to Kurios Stores server.");

        }

    }


    // =========================================================
    // PAGE TABS (Sellers / Students / Announcements)
    // =========================================================

    const pageTabs = document.querySelectorAll(".page-tab");
    const adminPages = document.querySelectorAll(".admin-page");

    pageTabs.forEach(function (tab) {

        tab.addEventListener("click", function () {

            pageTabs.forEach(function (t) {
                t.classList.remove("active");
            });

            tab.classList.add("active");

            const targetPage = tab.dataset.page;

            adminPages.forEach(function (page) {
                page.style.display = "none";
            });

            const targetEl =
                document.getElementById(targetPage + "Page");

            if (targetEl) {
                targetEl.style.display = "block";
            }

            if (targetPage === "students") {
                loadStudents();
            } else if (targetPage === "announcements") {
                loadAnnouncements();
            }

        });

    });


    // =========================================================
    // STUDENTS PAGE
    // =========================================================

    const studentSearchInput = document.getElementById("studentSearchInput");
    const studentsLoadingState = document.getElementById("studentsLoadingState");
    const studentsEmptyState = document.getElementById("studentsEmptyState");
    const studentList = document.getElementById("studentList");

    let studentSearchTimer = null;

    if (studentSearchInput) {

        studentSearchInput.addEventListener("input", function () {

            clearTimeout(studentSearchTimer);

            studentSearchTimer = setTimeout(function () {
                loadStudents();
            }, 350);

        });

    }

    async function loadStudents() {

        studentsLoadingState.style.display = "block";
        studentsEmptyState.style.display = "none";
        studentList.innerHTML = "";

        try {

            const search = studentSearchInput ? studentSearchInput.value.trim() : "";

            const url =
                API_URL + "/api/admin/students" +
                (search ? "?search=" + encodeURIComponent(search) : "");

            const response = await fetch(url, {
                headers: {
                    "Authorization": "Bearer " + getAdminToken()
                }
            });

            if (response.status === 401) {
                sessionStorage.removeItem("kuriosAdminToken");
                showKeyGate("Your session expired. Please sign in again.");
                return;
            }

            const data = await response.json();

            studentsLoadingState.style.display = "none";

            if (!data.success) {
                studentsEmptyState.textContent = data.message || "Could not load students.";
                studentsEmptyState.style.display = "block";
                return;
            }

            renderStudents(data.students);

        } catch (error) {

            studentsLoadingState.style.display = "none";
            studentsEmptyState.textContent = "Could not connect to Kurios Stores server.";
            studentsEmptyState.style.display = "block";

        }

    }

    function renderStudents(students) {

        studentList.innerHTML = "";

        if (students.length === 0) {
            studentsEmptyState.textContent = "No students found.";
            studentsEmptyState.style.display = "block";
            return;
        }

        studentsEmptyState.style.display = "none";

        students.forEach(function (student) {

            const card = document.createElement("div");
            card.className = "student-card";

            const fullName =
                ((student.first_name || "") + " " + (student.last_name || "")).trim();

            const suspendedBadge =
                student.is_suspended ?
                    `<span class="status-pill status-suspended">Suspended</span>` :
                    (student.email_verified ?
                        `<span class="status-pill status-approved">Active</span>` :
                        `<span class="status-pill status-pending">Unverified</span>`);

            const supportBadge =
                student.is_support ?
                    `<span class="status-pill status-approved">KSupport</span>` :
                    "";

            card.innerHTML = `
                <div class="student-card-info">
                    <h4>${escapeHtml(fullName || "—")} ${suspendedBadge} ${supportBadge}</h4>
                    <p>${escapeHtml(student.email || "")} · ${escapeHtml(student.phone || "—")}</p>
                    <p>${escapeHtml(student.university || "—")} · ${escapeHtml(student.student_id || "—")}</p>
                </div>
                <div class="student-card-actions"></div>
            `;

            const actions = card.querySelector(".student-card-actions");

            const toggleBtn = document.createElement("button");

            if (student.is_suspended) {

                toggleBtn.className = "btn-approve";
                toggleBtn.textContent = "Reinstate";
                toggleBtn.addEventListener("click", function () {
                    updateStudentSuspension(student.id, false);
                });

            } else {

                toggleBtn.className = "btn-reject";
                toggleBtn.textContent = "Suspend";
                toggleBtn.addEventListener("click", function () {

                    if (confirm("Suspend " + (fullName || "this student") + "? They won't be able to sign in.")) {
                        updateStudentSuspension(student.id, true);
                    }

                });

            }

            actions.appendChild(toggleBtn);

            const supportBtn = document.createElement("button");

            if (student.is_support) {

                supportBtn.className = "btn-reject";
                supportBtn.textContent = "Remove KSupport";
                supportBtn.addEventListener("click", function () {

                    if (confirm("Remove KSupport access from " + (fullName || "this student") + "?")) {
                        updateStudentSupportStatus(student.id, false);
                    }

                });

            } else {

                supportBtn.className = "btn-approve";
                supportBtn.textContent = "Make KSupport";
                supportBtn.addEventListener("click", function () {

                    if (confirm("Make " + (fullName || "this student") + " a KSupport staff member? They'll start receiving customer support conversations.")) {
                        updateStudentSupportStatus(student.id, true);
                    }

                });

            }

            actions.appendChild(supportBtn);

            studentList.appendChild(card);

        });

    }

    async function updateStudentSupportStatus(studentId, makeSupport) {

        try {

            const response = await fetch(
                API_URL + "/api/admin/students/" + studentId + "/" + (makeSupport ? "make-support" : "remove-support"),
                {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + getAdminToken()
                    }
                }
            );

            const data = await response.json();

            if (!data.success) {
                alert(data.message || "Could not update this student's KSupport status.");
                return;
            }

            loadStudents();

        } catch (error) {

            console.error("Update student support status error:", error);
            alert("Unable to connect to Kurios Stores server.");

        }

    }

    async function updateStudentSuspension(studentId, suspend) {

        try {

            const response = await fetch(
                API_URL + "/api/admin/students/" + studentId + "/" + (suspend ? "suspend" : "unsuspend"),
                {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + getAdminToken()
                    }
                }
            );

            const data = await response.json();

            if (!data.success) {
                alert(data.message || "Could not update this student's account.");
                return;
            }

            loadStudents();

        } catch (error) {

            alert("Could not connect to Kurios Stores server.");

        }

    }


    // =========================================================
    // ANNOUNCEMENTS PAGE
    // =========================================================

    const announceTitle = document.getElementById("announceTitle");
    const announceMessage = document.getElementById("announceMessage");
    const announceStatus = document.getElementById("announceStatus");
    const sendAnnouncementButton = document.getElementById("sendAnnouncementButton");
    const announcementsLoadingState = document.getElementById("announcementsLoadingState");
    const announcementsEmptyState = document.getElementById("announcementsEmptyState");
    const announcementList = document.getElementById("announcementList");

    if (sendAnnouncementButton) {

        sendAnnouncementButton.addEventListener("click", async function () {

            const title = announceTitle.value.trim();
            const message = announceMessage.value.trim();

            if (!title || !message) {
                announceStatus.textContent = "Please enter a title and a message.";
                return;
            }

            sendAnnouncementButton.disabled = true;
            sendAnnouncementButton.textContent = "Sending...";
            announceStatus.textContent = "";

            try {

                const response = await fetch(API_URL + "/api/admin/notifications", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + getAdminToken()
                    },
                    body: JSON.stringify({ title: title, message: message })
                });

                const data = await response.json();

                if (!data.success) {
                    announceStatus.textContent = data.message || "Could not send the announcement.";
                    return;
                }

                announceTitle.value = "";
                announceMessage.value = "";
                announceStatus.textContent = "Sent to all students.";

                loadAnnouncements();

            } catch (error) {

                announceStatus.textContent = "Could not connect to Kurios Stores server.";

            } finally {

                sendAnnouncementButton.disabled = false;
                sendAnnouncementButton.textContent = "Send to All Students";

            }

        });

    }

    async function loadAnnouncements() {

        announcementsLoadingState.style.display = "block";
        announcementsEmptyState.style.display = "none";
        announcementList.innerHTML = "";

        try {

            const response = await fetch(API_URL + "/api/notifications", {
                headers: {
                    "Authorization": "Bearer " + getAdminToken()
                }
            });

            const data = await response.json();

            announcementsLoadingState.style.display = "none";

            if (!data.success || data.notifications.length === 0) {
                announcementsEmptyState.style.display = "block";
                return;
            }

            data.notifications.forEach(function (note) {

                const card = document.createElement("div");
                card.className = "announce-card";

                const sentDate =
                    new Date(note.created_at).toLocaleString();

                card.innerHTML = `
                    <h4>${escapeHtml(note.title)}</h4>
                    <p>${escapeHtml(note.message)}</p>
                    <time>${escapeHtml(sentDate)}</time>
                `;

                announcementList.appendChild(card);

            });

        } catch (error) {

            announcementsLoadingState.style.display = "none";
            announcementsEmptyState.textContent = "Could not connect to Kurios Stores server.";
            announcementsEmptyState.style.display = "block";

        }

    }


    // =========================================================
    // KURIOS STORES LOGO
    // =========================================================

    let kuriosStoreId = null;

    async function loadKuriosStore() {

        try {

            const response = await fetch(API_URL + "/api/admin/kurios-store", {
                headers: {
                    "Authorization": "Bearer " + getAdminToken()
                }
            });

            const data = await response.json();

            if (!data.success) {
                return;
            }

            kuriosStoreId = data.seller.id;

            const logoEl = document.getElementById("kuriosStoreLogo");

            if (logoEl && data.seller.store_image) {

                logoEl.innerHTML =
                    `<img src="${API_URL + data.seller.store_image}" alt="Kurios Stores logo">`;

            }

            const linkStatusEl = document.getElementById("kuriosStoreLinkStatus");

            if (linkStatusEl) {

                if (data.seller.student_id) {

                    const linkedName =
                        [data.seller.linked_first_name, data.seller.linked_last_name]
                            .filter(Boolean)
                            .join(" ");

                    linkStatusEl.textContent =
                        "Linked to " +
                        (linkedName || "a student account") +
                        (data.seller.linked_email ? " (" + data.seller.linked_email + ")" : "") +
                        " — they can manage this store from their own dashboard.";

                } else {

                    linkStatusEl.textContent =
                        "Not yet linked to a student account.";

                }

            }

        } catch (error) {

            console.error("Load Kurios Store error:", error);

        }

    }

    const kuriosStoreLogoInput = document.getElementById("kuriosStoreLogoInput");

    if (kuriosStoreLogoInput) {

        kuriosStoreLogoInput.addEventListener("change", async function () {

            const file = kuriosStoreLogoInput.files[0];

            if (!file || !kuriosStoreId) {
                return;
            }

            const statusEl = document.getElementById("kuriosStoreLogoStatus");

            if (statusEl) statusEl.textContent = "Uploading...";

            const formData = new FormData();
            formData.append("logo", file);

            try {

                const response = await fetch(
                    API_URL + "/api/admin/sellers/" + kuriosStoreId + "/logo",
                    {
                        method: "POST",
                        headers: {
                            "Authorization": "Bearer " + getAdminToken()
                        },
                        body: formData
                    }
                );

                const data = await response.json();

                if (!data.success) {

                    if (statusEl) statusEl.textContent = data.message || "Could not update logo.";

                    return;

                }

                if (statusEl) statusEl.textContent = "Logo updated.";

                const logoEl = document.getElementById("kuriosStoreLogo");

                if (logoEl && data.seller.store_image) {

                    logoEl.innerHTML =
                        `<img src="${API_URL + data.seller.store_image}" alt="Kurios Stores logo">`;

                }

            } catch (error) {

                if (statusEl) statusEl.textContent = "Could not connect to server.";

            } finally {

                kuriosStoreLogoInput.value = "";

            }

        });

    }


    const kuriosStoreLinkButton = document.getElementById("kuriosStoreLinkButton");

    if (kuriosStoreLinkButton) {

        kuriosStoreLinkButton.addEventListener("click", async function () {

            const emailInput = document.getElementById("kuriosStoreLinkEmail");
            const statusEl = document.getElementById("kuriosStoreLinkFormStatus");

            const identifier = emailInput ? emailInput.value.trim() : "";

            if (!identifier) {

                if (statusEl) statusEl.textContent = "Enter the student's email first.";

                return;

            }

            kuriosStoreLinkButton.disabled = true;

            if (statusEl) statusEl.textContent = "Linking...";

            try {

                const response = await fetch(API_URL + "/api/admin/kurios-store/link", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + getAdminToken()
                    },
                    body: JSON.stringify({ identifier: identifier })
                });

                const data = await response.json();

                if (!data.success) {

                    if (statusEl) statusEl.textContent = data.message || "Could not link that account.";

                    return;

                }

                if (statusEl) statusEl.textContent = "Linked.";

                if (emailInput) emailInput.value = "";

                loadKuriosStore();

            } catch (error) {

                if (statusEl) statusEl.textContent = "Could not connect to server.";

            } finally {

                kuriosStoreLinkButton.disabled = false;

            }

        });

    }

    // PASSWORD SHOW/HIDE TOGGLE

    const adminPasswordToggle = document.getElementById("adminPasswordToggle");

    if (adminPasswordToggle) {

        adminPasswordToggle.addEventListener("click", function () {

            const input = document.getElementById("adminPasswordInput");

            if (!input) return;

            const icon = adminPasswordToggle.querySelector("i");

            if (input.type === "password") {

                input.type = "text";

                if (icon) {
                    icon.classList.remove("fa-eye");
                    icon.classList.add("fa-eye-slash");
                }

                adminPasswordToggle.setAttribute("aria-label", "Hide password");

            } else {

                input.type = "password";

                if (icon) {
                    icon.classList.remove("fa-eye-slash");
                    icon.classList.add("fa-eye");
                }

                adminPasswordToggle.setAttribute("aria-label", "Show password");

            }

        });

    }

</script>

</body>
</html>
